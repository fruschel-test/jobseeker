name: Refresh job report

on:
  workflow_dispatch:
  schedule:
    # 04:00, 08:00 and 20:00 in Brazil (UTC-3): 07:00, 11:00 and 23:00 UTC
    - cron: "0 7,11,23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare dashboard for publication
        run: |
          mkdir -p public
          cp index.html public/index.html
          test -s public/index.html

      - name: Build latest job report
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/build_report.py

      - name: Validate publication files
        run: |
          test -s public/index.html
          test -s public/jobs.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("public/jobs.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("jobs"), list), "jobs.json must contain a jobs array"
          print(f"Validated dashboard and jobs.json ({len(data['jobs'])} jobs)")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
